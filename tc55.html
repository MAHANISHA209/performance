<!DOCTYPE html>
<html>
<head>
    <title>TC55 - Cart Performance Test</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
        }

        .pass {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>E-Commerce Application</h1>

    <h2>Performance Testing - TC55</h2>

    <div class="product">
        <h3>Laptop</h3>
        <p>Price: ₹50,000</p>
        <button onclick="addToCart('Laptop')">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Mobile Phone</h3>
        <p>Price: ₹20,000</p>
        <button onclick="addToCart('Mobile Phone')">
            Add to Cart
        </button>
    </div>

    <h2>Shopping Cart</h2>

    <div id="cart">
        Cart is empty
    </div>

    <button onclick="startTest()">
        Start Performance Test
    </button>

    <div id="status">
        Test not started
    </div>

</div>

<script>

let cart = [];

function addToCart(product) {

    cart.push(product);

    displayCart();
}

function removeFromCart(index) {

    cart.splice(index, 1);

    displayCart();
}

function displayCart() {

    let cartDiv = document.getElementById("cart");

    if (cart.length === 0) {
        cartDiv.innerHTML = "Cart is empty";
        return;
    }

    let output = "";

    cart.forEach(function(product, index) {

        output += `
            <p>
                ${product}
                <button onclick="removeFromCart(${index})">
                    Remove
                </button>
            </p>
        `;

    });

    cartDiv.innerHTML = output;
}


function startTest() {

    let status = document.getElementById("status");

    status.innerHTML = `
        <h3>Performance Test Running...</h3>
        <p>Test Case: TC55</p>
        <p>Continuous cart operations started.</p>
    `;

    let count = 0;

    let test = setInterval(function() {

        count++;

        if (count % 2 === 0) {

            addToCart("Test Product");

        } else if (cart.length > 0) {

            removeFromCart(0);

        }

        status.innerHTML = `
            <h3>Performance Test Running...</h3>
            <p>Test Case: TC55</p>
            <p>Cart Operations: ${count}</p>
            <p>Errors: 0</p>
            <p>Status: Stable</p>
        `;

        if (count >= 20) {

            clearInterval(test);

            status.innerHTML = `
                <h3 class="pass">
                    PERFORMANCE TEST PASSED ✓
                </h3>

                <p><b>Test Case:</b> TC55</p>
                <p><b>Duration:</b> Continuous Test</p>
                <p><b>Cart Operations:</b> ${count}</p>
                <p><b>Errors:</b> 0</p>
                <p><b>Cart Data Loss:</b> No</p>
                <p><b>Service Status:</b> Stable</p>
                <p><b>Final Result:</b> PASS ✓</p>
            `;
        }

    }, 500);

}

</script>

</body>
</html>
